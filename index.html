<body>
  <button type="button" class="skip-link" data-action="skip">Langkau ke kandungan</button>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi modul">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">SCE</span>
        <span class="brand-text">
          <strong>SCE CENTRAL</strong>
          <small id="brand-company">Sri Cheras Enterprise</small>

      </div>

    </aside>

    <div class="scrim" id="scrim" data-action="menu-close" hidden></div>

    <div class="shell">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" data-action="menu-open" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="crumb">
          <span class="crumb-root">Business Operations Platform</span>
          <span class="crumb-page" id="crumb-page">Dashboard</span>
        </div>
        <span class="demo-pill" title="Semua angka dan nama pada halaman ini ialah data contoh">DATA CONTOH</span>
        <div class="topbar-actions">
          <div class="pop-wrap" id="notif-wrap">
            <button type="button" class="icon-btn" id="notif-btn" data-action="notif-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="notif-pop" aria-label="Notifikasi"></button>

          </div>
          <div class="pop-wrap">
            <button type="button" class="profile-btn" id="profile-btn" data-action="profile-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="profile-pop">
              <span class="avatar" id="profile-avatar" aria-hidden="true"></span>
              <span class="profile-text"><strong id="profile-name"></strong><small id="profile-role"></small></span>
            </button>
            <div class="popover profile-pop" id="profile-pop" hidden></div>
          </div>
        </div>
      </header>

      <div class="demo-bar" role="region" aria-label="Pratonton role DEV">
        <strong>DEV DEMO ONLY</strong>
        <span class="demo-bar-text">Pratonton role, bukan pengesahan sebenar.</span>
        <label class="demo-bar-field"><span class="sr">Akaun demo</span><select id="demo-role"></select></label>
        <button type="button" class="link-btn" data-action="demo-reset">Set semula data demo</button>
      </div>

      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modal-title"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" hidden></div>

  <noscript><p class="noscript">SCE CENTRAL memerlukan JavaScript untuk memaparkan dashboard ini.</p></noscript>
  <!-- Nombor versi (?v=): tukar setiap kali CSS/JS dikemas kini supaya pelayar memuat fail baharu. -->
